name: forecast

# Nightly Chronos-2 forecasts (implementation-plan.md §5.4). Reads daily_bars/instruments from Supabase and
# writes forecasts. Needs the repository secret SUPABASE_CONNECTION_STRING (and HF_TOKEN for a private mirror).
on:
  schedule:
    - cron: "0 10 * * 1-5" # 17:00 WIB, after the 16:30 EOD bars land
  workflow_dispatch:

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORECAST_MODE: actions
      FORECAST_MODEL_REPO: sktime/chronos2-onnx
      FORECAST_MODEL_REVISION: 84282421a54142dc689c0a71bc9876285b60bdae
      FORECAST_MODEL_SHA256: f06aba77b0445061b78639008074d71f45af8c0edf16c9dbe4c9ea513c422c0e
      FORECAST_MODEL_CACHE: ${{ github.workspace }}/.model-cache
      SUPABASE_CONNECTION_STRING: ${{ secrets.SUPABASE_CONNECTION_STRING }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      # Fails fast with a clear message instead of a .NET error later. Never prints the value.
      - name: Check secrets
        run: |
          if [ -z "${SUPABASE_CONNECTION_STRING// /}" ]; then
            echo "::error title=Missing secret::SUPABASE_CONNECTION_STRING repository secret is not set. Add it under Settings > Secrets and variables > Actions (use the Supabase pooler URI, port 5432 or 6543)."
            exit 1
          fi
          if printf '%s' "$SUPABASE_CONNECTION_STRING" | grep -Eqi '(@|host=)db\.[a-z0-9]+\.supabase\.co'; then
            echo "::error title=Direct host::SUPABASE_CONNECTION_STRING uses the IPv6-only direct host db.<ref>.supabase.co, which GitHub runners cannot reach. Use the pooler URI (aws-...pooler.supabase.com) instead."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore cached model
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: chronos-model-${{ env.FORECAST_MODEL_REPO }}-${{ env.FORECAST_MODEL_REVISION }}

      - name: Build
        run: dotnet build -c Release src/Sumire.Api

      - name: Forecast
        # Scheduled runs skip IDX holidays; a manual run always forecasts.
        run: >
          dotnet run -c Release --no-build --project src/Sumire.Api --
          forecast --once ${{ github.event_name == 'schedule' && '--skip-holidays' || '' }}
